# Corre las pruebas del motor y de los datos (prototipo/pruebas/*.test.mjs) en cada cambio.
# Localmente: node --test "prototipo/pruebas/*.test.mjs"
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: node --test "prototipo/pruebas/*.test.mjs"
